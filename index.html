<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pond Project</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #f5f7f3;
      position: relative;
      overflow-x: hidden;
      background: #0b1110;
    }

    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.28);
      z-index: -1;
    }

    .topbar {
      position: sticky;
      top: 0;
      background: rgba(22, 42, 30, 0.55);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
    }

    .topbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-weight: 700;
      color: #c7ebd1;
      font-size: 1.1rem;
    }

    .nav a {
      color: #eef6ef;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      margin-left: 8px;
      display: inline-block;
    }

    .hero {
      max-width: 1200px;
      margin: 0 auto;
      padding: 70px 20px 30px;
      text-align: center;
    }

    .section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 20px 70px;
    }

    .tile-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .tile {
      min-height: 280px;
      border-radius: 24px;
      text-decoration: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 12px 35px rgba(0,0,0,0.16);
      transition: transform 0.2s ease;
    }

    .tile:hover {
      transform: translateY(-4px);
    }

    .tile::before {
      content: "";
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 0;
    }

    .tile::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.03);
      z-index: 1;
    }

    .tile h2 {
      position: relative;
      z-index: 2;
      margin: 0;
      font-size: 2.4rem;
      font-weight: 500;
      text-shadow: 0 4px 18px rgba(0,0,0,0.35);
    }

    .tile-bacteria::before {
      background-image: url("bacteria2.png.jpeg");
    }

    .tile-pondlife::before {
      background-image: url("Pondlife.png");
    }

    footer {
      display: none;
    }

    @media (max-width: 800px) {
      .tile-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <video class="bg-video" autoplay muted loop playsinline>
    <source src="video321.mp4" type="video/mp4">
  </video>

  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">Pond Project</div>
      <div class="nav">
        <a href="about.html">About</a>
      </div>
    </div>
  </div>

  <section class="hero"></section>

  <section class="section">
    <div class="tile-grid">
      <a class="tile tile-bacteria" href="bacteria.html">
        <h2>Bacteria</h2>
      </a>

      <a class="tile tile-pondlife" href="pondlife.html">
        <h2>Pond Life</h2>
      </a>
    </div>
  </section>

  <footer></footer>
</body>
</html>
