<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pond Project</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: 
        radial-gradient(circle at top left, rgba(88, 130, 96, 0.22), transparent 30%),
        radial-gradient(circle at top right, rgba(60, 94, 68, 0.18), transparent 28%),
        linear-gradient(180deg, #182d21 0%, #22382a 45%, #2c4633 75%, #1f3527 100%);
      color: #f5f7f3;
    }

    .topbar {
      position: sticky;
      top: 0;
      background: rgba(22, 42, 30, 0.92);
      border-bottom: 1px solid rgba(255,255,255,0.05);
   }  
    .topbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

        .brand {
      font-weight: 700;
      color: #c7ebd1;
      font-size: 1.1rem;
    }

        .nav a {
      color: #eef6ef;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      margin-left: 8px;
      display: inline-block;
    }
    .hero {
      max-width: 1200px;
      margin: 0 auto;
      padding: 70px 20px 30px;
      text-align: center;
    }

        .hero h1 {
      margin: 0;
      font-size: 3rem;
      color: #f5f7f3;
    }

    .section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 20px 70px;
    }

    .tile-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .tile {
      min-height: 280px;
      border-radius: 24px;
      text-decoration: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 12px 30px rgba(0,0,0,0.25);
      transition: transform 0.2s ease;
    }

    .tile:hover {
      transform: translateY(-4px);
    }

    .tile h2 {
      position: relative;
      z-index: 2;
      margin: 0;
      font-size: 2.4rem;
      font-weight: 500;
    }

    .tile::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.18);
}

.tile-bacteria {
  background: url("Bacteria.png") center center / cover no-repeat;
}

.tile-pondlife {
  background: url("Pondlife.png") center center / cover no-repeat;
}

          footer {
        text-align: center;
        padding: 30px 20px 50px;
        color: #c0d1c4;
      }

    @media (max-width: 800px) {
      .tile-grid {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 2.2rem;
        color: #f4f7f2;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand">Pond Project</div>
      <div class="nav">
        <a href="about.html">About</a>
      </div>
    </div>
  </div>

  <section class="hero">
    <h1>Pond Microorganisms Project</h1>
  </section>

  <section class="section">
    <div class="tile-grid">
      <a class="tile tile-bacteria" href="bacteria.html">
        <h2>Bacteria</h2>
      </a>

      <a class="tile tile-pondlife" href="pondlife.html">
        <h2>Pond Life</h2>
      </a>
    </div>
  </section>

  <footer>Pond Project Website</footer>
</body>
</html>
